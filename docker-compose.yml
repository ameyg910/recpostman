services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_USER=postman_amey
      - POSTGRES_PASSWORD=@Ameyb1ts
      - POSTGRES_DB=rec_postman
      - DATABASE_URL=postgres://postman_amey:@Ameyb1ts@db:5432/rec_postman?sslmode=disable
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_APP_PASSWORD=${SMTP_APP_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postman_amey
      - POSTGRES_PASSWORD=@Ameyb1ts
      - POSTGRES_DB=rec_postman
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
